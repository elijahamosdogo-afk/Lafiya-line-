function pEdu(){return H('Health Education','All clinical content must be approved by a healthcare professional before use.')+`<div class="c">${tbl(['Title','Type','Languages','Status',''],S.edu.map(e=>`<tr><td>${E(e.t)}</td><td>${e.ty}</td><td>${E(e.lg)}</td><td>${e.ok?B('Approved','ok'):B('Pending approval','warn')}</td><td>${!e.ok&&can('appr')?`<button class="bt sm" onclick="apr('edu',${e.id})">Approve</button>`:''}</td></tr>`).join(''))}</div>
<div class="g g2"><div class="c"><h2>Add content</h2>${fld('et','Title',inp('et'))}${fld('ety','Type',sel('ety',['Education','FAQ','Approved information']))}${fld('elg','Languages',inp('elg','text','English'))}<button class="bt" onclick="addEdu()">Submit for approval</button></div>
<div class="c"><h2>Audio message library</h2><ul class="l">${S.scr.map(s=>`<li>${E(s.audio||'(no recording)')} <span class="m">· ${s.lang} · ${s.camp}</span></li>`).join('')}</ul></div></div>`}
function addEdu(){const t=$('#et').value.trim();if(t.length<5)return toast('Enter a title');S.edu.push({id:nid(),t,ty:$('#ety').value,lg:$('#elg').value,ok:false});save();toast('Submitted for approval');render()}
function pFac(){return H('Healthcare Facilities','Immunisation service locations')+`<div class="c">${tbl(['Facility','Location','Contact','Days','Hours','Staff'],S.fac.map(f=>`<tr><td>${E(f.name)}</td><td>${E(f.loc)}</td><td>${E(f.ph)}</td><td>${E(f.days)}</td><td>${E(f.hrs)}</td><td>${E(f.staff)}</td></tr>`).join(''))}</div>
<div class="c"><h2>Add facility</h2><div class="g g2"><div>${fld('fnm','Name',inp('fnm'))}${fld('floc','Location',inp('floc'))}${fld('fph','Contact',inp('fph'))}</div><div>${fld('fd','Operating days',inp('fd'))}${fld('fh','Service hours',inp('fh'))}${fld('fs','Assigned staff',inp('fs'))}</div></div><button class="bt" ${dis('fac')} onclick="addFac()">Add facility</button></div>`}
function addFac(){const v=i=>$('#'+i).value.trim();if(v('fnm').length<3||!v('floc'))return toast('Enter at least a name and location');S.fac.push({id:nid(),name:v('fnm'),loc:v('floc'),ph:v('fph'),days:v('fd'),hrs:v('fh'),staff:v('fs')});save();toast('Facility added');render()}
/* reports, users, settings */
function pRep(){const inR=d=>(!rf||d>=rf)&&(!rt||d<=rt),cg=S.cg.filter(x=>inR(x.reg)),ch=S.ch.filter(c=>cg.some(g=>g.id===c.cg)),cl=S.calls.filter(c=>c.status!=='Pending'&&inR(c.at||c.date)),n=s=>cl.filter(c=>c.status===s).length,rc={},fu=S.fu.filter(f=>inR(f.at));
cg.forEach(g=>{const k=(g.ref||'').trim()||'Not stated';rc[k]=(rc[k]||0)+1});
const rows=[['Mothers enrolled',cg.length],['Check-in calls answered',n('Completed')],['Calls unanswered',n('Unanswered')],['Calls failed',n('Failed')],['Callbacks raised',fu.length],['Callbacks answered',fu.filter(f=>f.st==='Assistance provided'||f.st==='Closed').length],['Came back for next dose',ch.filter(backOf).length],['Missed or overdue doses',S.ap.filter(a=>inR(a.date)&&(a.st==='missed'||st(a)==='overdue')).length]];
return H('Reports','Filter by date and export (simulated)',`<button class="bt" onclick="toast('Report exported (simulated)')">Export report</button>`)+`<div class="c"><div class="bar"><label class="f"><span>From</span><input type="date" value="${rf}" onchange="rf=this.value;render()"></label><label class="f"><span>To</span><input type="date" value="${rt}" onchange="rt=this.value;render()"></label></div>${tbl(['Metric','Value'],rows.map(r=>`<tr><td>${r[0]}</td><td><b>${r[1]}</b></td></tr>`).join(''))}</div>
<div class="c"><h2>Referrals</h2>${tbl(['Referred by','Mothers enrolled'],Object.entries(rc).sort((a,b)=>b[1]-a[1]).map(e=>`<tr><td>${E(e[0])}</td><td><b>${e[1]}</b></td></tr>`).join(''))}</div>`}
function pUsers(){const caps=[['View dashboards and reports','ahs'],['Register caregivers and children','ah'],['Verify immunisation records','ah'],['Update aftercare requests','ah'],['Approve scripts and education content','as'],['Manage voice scripts','a'],['Manage facilities and users','a']];
return H('User Management','Role-based access (demo)')+`<div class="c">${tbl(['Name','Email','Role'],USERS.map(u=>`<tr><td>${u.name}</td><td>${u.email}</td><td>${B(R[u.role],'bl')}</td></tr>`).join(''))}</div><div class="c"><h2>Role permissions</h2>${tbl(['Capability','Admin','Health worker','Supervisor'],caps.map(c=>`<tr><td>${c[0]}</td>${['a','h','s'].map(r=>`<td>${c[1].includes(r)?'✔':'—'}</td>`).join('')}</tr>`).join(''))}<p class="m" style="margin-top:8px">Sign in with each demo account to see permissions change.</p></div>`}
function pSet(){return H('Settings')+`<div class="c"><h2>Appearance</h2><select onchange="setTheme(this.value)"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></div><div class="c"><h2>Demo data</h2><p class="m">Data is stored in this browser only. A real API and PostgreSQL database can replace the data layer (load / save) later.</p><button class="bt g" onclick="if(confirm('Reset all demo data?')){const s=S.sess;seed();S.sess=s;save();go('dashboard');toast('Demo data reset')}">Reset demo data</button></div>`}
const PG={dashboard:pDash,caregivers:pCg,register:pReg,children:pChildren,child:pChild,appointments:pAppt,voice:pVoice,followup:pFu,education:pEdu,facilities:pFac,reports:pRep,users:pUsers,settings:pSet};
onhashchange=()=>{const h=location.hash.slice(1);if(h&&h!==view&&S.sess&&PG[h]){view=h;render()}};
try{const t=localStorage.getItem('ll_theme');if(t)setTheme(t)}catch(e){}
S=load();if(!S||!S.cg)seed();render();
</script></body></html>
