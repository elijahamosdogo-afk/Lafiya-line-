async function saveReg(eid) {
    const v = i => ($('#' + i)?.value || '').trim();
    let ok = true;

    document.querySelectorAll('.er').forEach(e => e.textContent = '');

    const er = (i, m) => {
        $('#e-' + i).textContent = m;
        ok = false;
    };

    if (!/^(0|\+234)[789]\d{9}$/.test(v('ph').replace(/\s/g, ''))) {
        er('ph', 'Enter a valid Nigerian number, e.g. 0803 445 2211');
    }

    if (!$('#cs').checked) {
        er('cs', 'Consent is needed to send automated calls');
    }

    if (!eid) {
        if (!v('dg')) er('dg', 'Choose the dose given today');

        const a = v('age');
        const w = v('au') === 'weeks';

        if (a === '' || +a < 0 || +a > (w ? 104 : 59)) {
            er('age', w ? 'Enter 0–104 weeks' : 'Enter 0–59 months');
        }

        if (!v('nd')) {
            er('nd', 'Pick the next dose date');
        } else if (v('nd') <= T()) {
            er('nd', 'Next dose must be after today');
        }
    }

    if (!ok) return toast('Please fix the highlighted fields');

    // Editing an existing registration
    if (eid) {
        const g = cgOf(eid);

        Object.assign(g, {
            ph: v('ph'),
            fac: +v('fac'),
            ref: v('rb'),
            lang: v('lg')
        });

        S.ch.filter(c => c.cg === eid).forEach(c => c.fac = g.fac);

        save();
        toast('Enrolment updated');
        return go('caregivers');
    }

    // Save the new registration to the backend first
    try {
        const response = await fetch(
            'https://lafiya-line-voice.onrender.com/register',
            {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    phone: v('ph'),
                    language: v('lg'),
                    referredBy: v('rb'),
                    age: Number(v('age')),
                    ageUnit: v('au'),
                    dose: v('dg'),
                    nextDoseDate: v('nd')
                })
            }
        );

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(result.message || 'Registration failed');
        }

        console.log('Supabase registration successful:', result);

        // Only update the local demo data after backend success
        const f = +v('fac');

        const g = {
            id: nid(),
            name: 'Mother …' + v('ph').replace(/\s/g, '').slice(-4),
            ph: v('ph'),
            lang: v('lg'),
            time: '—',
            reg: T(),
            consent: true,
            fac: f,
            sec: '',
            ref: v('rb')
        };

        const c = {
            id: nid(),
            cg: g.id,
            ref: result.child?.child_name || 'Baby LL-' + (1001 + S.ch.length),
            dob: add(
                T(),
                -Math.round(
                    Number(v('age')) *
                    (v('au') === 'weeks' ? 7 : 30.4)
                )
            ),
            sex: '—',
            fac: f,
            rec: '',
            dose: v('dg')
        };

        S.cg.push(g);
        S.ch.push(c);

        const d1 = {
            id: nid(),
            ch: c.id,
            visit: 'Dose given',
            vac: v('dg') + ' dose',
            date: T(),
            st: 'attended',
            rep: 'yes',
            ver: true
        };

        const d2 = {
            id: nid(),
            ch: c.id,
            visit: 'Next dose',
            vac: 'Next dose due',
            date: v('nd'),
            st: 'scheduled',
            rep: null,
            ver: false
        };

        S.ap.push(d1, d2);
        schedCalls(d1);
        save();

        toast('Registration saved to Supabase successfully!');
        go(S.sess.role === 'h' ? 'register' : 'child', c.id);

    } catch (error) {
        console.error('Registration failed:', error);
        toast('Database error: ' + error.message);
    }
}

function heard(c){const a=apOf(c.ap),ch=chOf(a.ch),g=cgOf(ch.cg),L=gl||(['Hausa','Kanuri','English'].includes(g.lang)?g.lang:'Hausa'),F=(camp,k)=>S.scr.find(x=>x.camp===camp&&x.plays===k&&x.lang===L&&x.audio)||S.scr.find(x=>x.camp===camp&&x.plays===k&&x.lang==='Hausa');
const nx=S.ap.filter(x=>x.ch===ch.id&&x.st==='scheduled').sort((x,y)=>x.date<y.date?-1:1)[0];
if(c.type===1)return (F('Call 1 · 24 hours','All')||{msg:''}).msg;
const m=F('Call 2 · 72 hours','All'),t=F('Call 2 · 72 hours',TAIL[ch.dose]||'');if(!m)return '';
return m.msg.replace('[[TAIL]]',t?'\n'+t.msg:'').replace('{{NEXT_DOSE}}',nx?new Date(nx.date+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}):'(no next dose on record)').replace('{{FACILITY}}',fn(ch.fac))}
let gl='',au=null;
const by=t=>{if(!t)return '';const[h,m]=t.split(':').map(Number);return String((h+2)%24).padStart(2,'0')+':'+String(m).padStart(2,'0')};
const gateHtml=()=>`<span class="m" style="width:100%">Language gate: she presses</span>`+[['Hausa',1],['Kanuri',2],['English',3]].map(([l,k])=>`<button type="button" class="pp ${gl===l?'on':''}" onclick="setGl('${l}')">${k} · ${l}</button>`).join('')+`<button type="button" class="pp ${gl?'':'on'}" onclick="setGl('')">No press (6s)</button>`;
function setGl(l){gl=l;hr()}
function play(){const c=S.calls.find(x=>x.id===+($('#sa')?.value));if(!c)return toast('Pick a call first');
const ch=chOf(apOf(c.ap).ch),L=gl||cgOf(ch.cg).lang,l=L==='English'?'en':'ha',q=c.type===1?['call1_'+l]:['call2_'+l,(TAIL[ch.dose]||'bcg')+'_'+l];
if(au){au.pause();au=null}
const nx=()=>{const n=q.shift(),p=$('#ps');if(!n){p.textContent='Finished.';return}
const url=AUDIO_BASE+n+'.mp3';
au=new Audio(url);p.textContent='Playing '+n+'.mp3'+(L==='Kanuri'?' (no Kanuri recording yet, playing Hausa)':'');
au.onended=nx;
au.onerror=()=>{p.textContent='Skipped missing file: '+n+'.mp3';setTimeout(nx,400)};
au.play().catch(e=>{p.textContent='Skipped: '+n+'.mp3 ('+e.message+')';setTimeout(nx,400)})};nx()}
function realCall(){
  const c=S.calls.find(x=>x.id===+($('#sa')?.value));
  if(!c)return toast('Pick a pending call first');
  if(!can('sim'))return toast('Not permitted');
  const a=apOf(c.ap),ch=chOf(a.ch),g=cgOf(ch.cg);
  // Ready for backend integration:
  // POST ${API_BASE}/api/calls/initiate  { callId: c.id, phone: g.ph, type: c.type, language: g.lang, audioUrl: AUDIO_BASE + ... }
  toast('Backend not connected yet. When ready, this will POST to '+API_BASE+'/api/calls/initiate for '+g.ph);
  console.log('realCall payload ready',{callId:c.id,phone:g.ph,type:c.type,lang:g.lang,ap:a.id,child:ch.id});
}

const heardHtml=c=>{if(!c)return '';const ch=chOf(apOf(c.ap).ch);return `<b>What she hears · ${E(gl||cgOf(ch.cg).lang)}${(gl||cgOf(ch.cg).lang)==='Kanuri'?' (no Kanuri recording yet, plays Hausa)':''} · dose given: ${E(ch.dose||'')}</b><br>${E(heard(c))}`};
function hr(){const c=S.calls.find(x=>x.id===+$('#sa').value);$('#gp').innerHTML=gateHtml();$('#hd').innerHTML=heardHtml(c)}
function sim(){const c=S.calls.find(x=>x.id===+($('#sa')?.value)),o=$('#so').value;if(!c)return toast('No pending calls. Enrol a mother first.');if(!can('sim'))return toast('Not permitted');
if(o==='again')return toast('Pressed 3: the message plays again');if(o==='lang')return toast('Pressed 4: the call offers another language');
const a=apOf(c.ap),ch=chOf(a.ch),g=cgOf(ch.cg);c.at=T();
if(o==='Failed'){c.status='Failed';c.resp='Line could not connect'}else if(o==='Unanswered'){c.status='Unanswered';c.resp='No response received';lg('na',cgOf(ch.cg).ph)}
else{c.status='Completed';c.resp=o==='help'?'Needs help':'Baby is well';lg(o==='help'?'p1':'p2',cgOf(ch.cg).ph);
if(o==='help'&&!S.fu.some(f=>f.ch===a.ch&&f.st==='Open'))S.fu.push({id:nid(),ch:a.ch,cg:g.id,call:c.type,time:new Date().toTimeString().slice(0,5),reason:'Mother needs help',st:'Open',at:T(),new:true})}
save();toast('Call '+c.type+' simulated: '+c.status);render()}
/* aftercare */
const SIGNS=[['feeding','Stopped feeding'],['convulsion','Fits or shaking'],['vomiting','Vomiting everything'],['sleepy','Unusually sleepy / hard to wake'],['breathing','Fast or difficult breathing'],['yellow','Yellow eyes or skin'],['site','Hot or pus at injection site']],OUT=['Reassured','Come in today','Escalated'];
const banner=()=>{const f=S.fu.find(x=>x.new&&x.st==='Open');return f&&can('fu')?`<div class="bn" onclick="openFu(${f.id})">New request, she said she is worried →</div>`:''};
function openFu(id){S.fu.find(x=>x.id===id).new=false;save();go('followup');setTimeout(()=>{const e=$('#fu'+id);if(e)e.scrollIntoView({block:'center'})},60)}
function pFu(){const op=S.fu.filter(f=>f.st==='Open').sort((a,b)=>b.id-a.id),dn=S.fu.filter(f=>f.st==='Called back'),cnt=[['Open requests',op.length],['Called back',dn.length],...OUT.map(o=>[o,dn.filter(f=>f.out===o).length])];
const card=(f,i)=>{const g=cgOf(f.cg),c=chOf(f.ch);return `<div class="c" id="fu${f.id}" style="border-left:6px solid var(--bad)">${i===0?B('Duty card','bad'):''}<div class="row"><b>${E(fn(c.fac))}</b>${B(f.call===2?'72h call':'24h call','bl')}</div><div class="n" style="font-size:24px">${E(g.ph)}</div><p class="m">${E(f.time||'')} · raised ${fmt(f.at)}</p><p><b>Call back within 2 hours · by ${by(f.time)}</b></p><p><b>She said she is worried.</b></p>
<div>${SIGNS.map(([k,l])=>`<label style="margin-right:10px;white-space:nowrap;font-size:13px"><input type="checkbox" style="width:auto;margin-right:3px" ${(f.signs||[]).includes(k)?'checked':''} ${dis('fu')} onchange="fuSign(${f.id},'${k}',this.checked)">${l}</label>`).join('')}</div>
<div class="pr" style="margin:12px 0">${OUT.map(o=>`<button type="button" class="pp ${f.out===o?'on':''}" ${dis('fu')} onclick="fuOut(${f.id},'${o}')">${o}</button>`).join('')}</div><button class="bt" ${dis('fu')} onclick="fuDone(${f.id})">Mark as called back</button></div>`};
return H('Aftercare','Every press of 1 lands here as a duty card')+`<div class="g g3">${cnt.map(c=>`<div class="c"><div class="m">${c[0]}</div><div class="n">${c[1]}</div></div>`).join('')}</div>
<div style="margin-top:14px">${op.map(card).join('')||'<div class="c m">No open requests</div>'}</div>
<div class="c"><h2>Called back</h2>${tbl(['Mother','Outcome','Date'],dn.map(f=>`<tr><td>${E(cgOf(f.cg).ph)}</td><td>${E(f.out)}</td><td>${fmt(f.cb||f.at)}</td></tr>`).join(''))}</div>
<div class="c"><h2>Activity log</h2><ul class="l">${S.log.slice(-12).reverse().map(x=>`<li>${LGT[x.k]} <span class="m">· ${E(x.ref)} · ${x.at}</span></li>`).join('')||'<li class="m">Nothing yet</li>'}</ul></div>`}
function fuSign(id,k,on){if(!can('fu'))return toast('Not permitted');const f=S.fu.find(x=>x.id===id);f.signs=f.signs||[];f.signs=on?[...new Set([...f.signs,k])]:f.signs.filter(x=>x!==k);save();toast('Danger signs saved')}
function fuOut(id,o){if(!can('fu'))return toast('Not permitted');S.fu.find(f=>f.id===id).out=o;save();render();setTimeout(()=>{const e=$('#fu'+id);if(e)e.scrollIntoView({block:'center'})},60)}
function fuDone(id){if(!can('fu'))return toast('Not permitted');const f=S.fu.find(x=>x.id===id);if(!f.out)return toast('Choose an outcome first');f.st='Called back';f.cb=T();f.new=false;save();toast('Marked as called back');render()}
/* education, facilities */
function pEdu(){return H('Health Education','All clinical content must be approved by a healthcare professional before use.')+`<div class="c">${tbl(['Title','Type','Languages','Status',''],S.edu.map(e=>`<tr><td>${E(e.t)}</td><td>${e.ty}</td><td>${E(e.lg)}</td><td>${e.ok?B('Approved','ok'):B('Pending approval','warn')}</td><td>${!e.ok&&can('appr')?`<button class="bt sm" onclick="apr('edu',${e.id})">Approve</button>`:''}</td></tr>`).join(''))}</div>
<div class="g g2"><div class="c"><h2>Add content</h2>${fld('et','Title',inp('et'))}${fld('ety','Type',sel('ety',['Education','FAQ','Approved information']))}${fld('elg','Languages',inp('elg','text','English'))}<button class="bt" onclick="addEdu()">Submit for approval</button></div>
<div class="c"><h2>Audio message library</h2><ul class="l">${S.scr.map(s=>`<li>${E(s.audio||'(no recording)')} <span class="m">· ${s.lang} · ${s.camp}</span></li>`).join('')}</ul></div></div>`}
function addEdu(){const t=$('#et').value.trim();if(t.length<5)return toast('Enter a title');S.edu.push({id:nid(),t,ty:$('#ety').value,lg:$('#elg').value,ok:false});save();toast('Submitted for approval');render()}
function pFac(){return H('Healthcare Facilities','Immunisation service locations')+`<div class="c">${tbl(['Facility','Location','Contact','Days','Hours','Staff'],S.fac.map(f=>`<tr><td>${E(f.name)}</td><td>${E(f.loc)}</td><td>${E(f.ph)}</td><td>${E(f.days)}</td><td>${E(f.hrs)}</td><td>${E(f.staff)}</td></tr>`).join(''))}</div>
<div class="c"><h2>Add facility</h2><div class="g g2"><div>${fld('fnm','Name',inp('fnm'))}${fld('floc','Location',inp('floc'))}${fld('fph','Contact',inp('fph'))}</div><div>${fld('fd','Operating days',inp('fd'))}${fld('fh','Service hours',inp('fh'))}${fld('fs','Assigned staff',inp('fs'))}</div></div><button class="bt" ${dis('fac')} onclick="addFac()">Add facility</button></div>`}
function addFac(){const v=i=>$('#'+i).value.trim();if(v('fnm').length<3||!v('floc'))return toast('Enter at least a name and location');S.fac.push({id:nid(),name:v('fnm'),loc:v('floc'),ph:v('fph'),days:v('fd'),hrs:v('fh'),staff:v('fs')});save();toast('Facility added');render()}
/* reports, users, settings */
function pRep(){const inR=d=>(!rf||d>=rf)&&(!rt||d<=rt),cg=S.cg.filter(x=>inR(x.reg)),ch=S.ch.filter(c=>cg.some(g=>g.id===c.cg)),cl=S.calls.filter(c=>c.status!=='Pending'&&inR(c.at||c.date)),n=s=>cl.filter(c=>c.status===s).length,rc={},fu=S.fu.filter(f=>inR(f.at));
cg.forEach(g=>{const k=(g.ref||'').trim()||'Not stated';rc[k]=(rc[k]||0)+1});
const rows=[['Mothers enrolled',cg.length],['Check-in calls answered',n('Completed')],['Calls unanswered',n('Unanswered')],['Calls failed',n('Failed')],['Callbacks raised',fu.length],['Callbacks answered',fu.filter(f=>f.st==='Called back').length],['Reassured',fu.filter(f=>f.st==='Called back'&&f.out==='Reassured').length],['Come in today',fu.filter(f=>f.st==='Called back'&&f.out==='Come in today').length],['Escalated',fu.filter(f=>f.st==='Called back'&&f.out==='Escalated').length],['Came back for next dose',ch.filter(backOf).length],['Missed or overdue doses',S.ap.filter(a=>inR(a.date)&&(a.st==='missed'||st(a)==='overdue')).length]];
return H('Reports','Filter by date and export (simulated)',`<button class="bt" onclick="toast('Report exported (simulated)')">Export report</button>`)+`<div class="c"><div class="bar"><label class="f"><span>From</span><input type="date" value="${rf}" onchange="rf=this.value;render()"></label><label class="f"><span>To</span><input type="date" value="${rt}" onchange="rt=this.value;render()"></label></div>${tbl(['Metric','Value'],rows.map(r=>`<tr><td>${r[0]}</td><td><b>${r[1]}</b></td></tr>`).join(''))}</div>
<div class="c"><h2>Referrals</h2>${tbl(['Referred by','Mothers enrolled'],Object.entries(rc).sort((a,b)=>b[1]-a[1]).map(e=>`<tr><td>${E(e[0])}</td><td><b>${e[1]}</b></td></tr>`).join(''))}</div>`}
function pUsers(){const caps=[['View dashboards and reports','ahs'],['Register caregivers and children','ah'],['Verify immunisation records','ah'],['Update aftercare requests','ah'],['Approve scripts and education content','as'],['Manage voice scripts','a'],['Manage facilities and users','a']];
return H('User Management','Role-based access (demo)')+`<div class="c">${tbl(['Name','Email','Role'],USERS.map(u=>`<tr><td>${u.name}</td><td>${u.email}</td><td>${B(R[u.role],'bl')}</td></tr>`).join(''))}</div><div class="c"><h2>Role permissions</h2>${tbl(['Capability','Admin','Health worker','Supervisor'],caps.map(c=>`<tr><td>${c[0]}</td>${['a','h','s'].map(r=>`<td>${c[1].includes(r)?'✔':'—'}</td>`).join('')}</tr>`).join(''))}<p class="m" style="margin-top:8px">Sign in with each demo account to see permissions change.</p></div>`}
function pSet(){return H('Settings')+`<div class="c"><h2>Appearance</h2><select onchange="setTheme(this.value)"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></div><div class="c"><h2>Demo data</h2><p class="m">Data is stored in this browser only. A real API and PostgreSQL database can replace the data layer (load / save) later.</p><button class="bt g" onclick="if(confirm('Reset all demo data?')){const s=S.sess;seed();S.sess=s;save();go('dashboard');toast('Demo data reset')}">Reset demo data</button></div>`}
const PG={dashboard:pDash,caregivers:pCg,register:pReg,children:pChildren,child:pChild,appointments:pAppt,voice:pVoice,followup:pFu,education:pEdu,facilities:pFac,reports:pRep,users:pUsers,settings:pSet};
onhashchange=()=>{const h=location.hash.slice(1);if(h&&h!==view&&S.sess&&PG[h]){view=h;render()}};
try{const t=localStorage.getItem('ll_theme');if(t)setTheme(t)}catch(e){}
S=load();if(!S||!S.cg)seed();render();
</script></body></html>
